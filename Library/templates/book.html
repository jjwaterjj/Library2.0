<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>{{ book['title'] }}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="{{ (book['genre'] or 'default')|lower|replace(' ', '-') }}">

    <h1>Book Details</h1>

    <h2>{{ book['title'] }}</h2>

    <p>
        <strong>ID:</strong>
        {{ book['id'] }}
    </p>

    <p>
        <strong>Author:</strong>
        {{ book['author'] }}
    </p>

    <p>
        <strong>Year:</strong>
        {{ book['year'] }}
    </p>

    <p>
        <strong>Genre:</strong>
        {{ book['genre'] }}
    </p>

    <br>

    <a href="{{ url_for('edit', id=book['id']) }}">
        Edit Book
    </a>

    <br><br>

    <a href="{{ url_for('index') }}">
        Back to Library
    </a>

</body>

</html>
